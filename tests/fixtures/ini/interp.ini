; Fake app.ini exercising go-ini's %(NAME)s references.
TOP = toptext
X = top
BASE = /srv
WORK_PATH = %(BASE)s/data
SPACED = a b\c *?

[server]
PROTOCOL = http
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 3000
LOCAL_ROOT_URL = %(PROTOCOL)s://%(HTTP_ADDR)s:%(HTTP_PORT)s/
MISSING_REF = %(NOSUCHKEY)s/tail
FROM_TOP = [%(TOP)s]
X = %(X)s
A = %(B)s
B = %(C)s
C = z
CYCLE1 = %(CYCLE2)s
CYCLE2 = %(CYCLE1)s
PLAIN = just text
PERCENT = 100% done
DOTTED = %(a.b)s stays
USE_SPACED = [%(SPACED)s]
