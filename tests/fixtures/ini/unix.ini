; Fake app.ini for an install that listens on a unix socket. With PROTOCOL =
; http+unix the socket path is HTTP_ADDR, and Forgejo dials that socket for
; its own local requests whatever LOCAL_ROOT_URL says - so LOCAL_ROOT_URL is
; deliberately absent here and the health-check URL falls to Forgejo's own
; http+unix default.
[server]
PROTOCOL = http+unix
HTTP_ADDR = /run/forgejo/forgejo.sock

[database]
DB_TYPE = sqlite3
