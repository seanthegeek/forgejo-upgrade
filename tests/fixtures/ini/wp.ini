; The stock app.ini with an absolute WORK_PATH, which sits in the keys before
; the first [section]. Forgejo reads it after it has found the config file and
; it replaces whatever --work-path or the environment gave.
WORK_PATH = /srv/data

[server]
PROTOCOL = http
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 3000

[database]
DB_TYPE = sqlite3
